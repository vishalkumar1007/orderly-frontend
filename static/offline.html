<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>You're offline — Orderly</title>
		<style>
			:root {
				--bg: #f7f8fb;
				--surface: #fff;
				--border: #e4e7ef;
				--text: #0d1424;
				--text-2: #4a5568;
				--accent: #6366f1;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #08090f;
					--surface: #10121d;
					--border: #242939;
					--text: #eef1f7;
					--text-2: #9aa3b5;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 1.5rem;
				background: var(--bg);
				color: var(--text);
				font-family: 'Inter', system-ui, -apple-system, sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			.card {
				width: 100%;
				max-width: 24rem;
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 16px;
				padding: 1.75rem 1.5rem;
				text-align: center;
			}
			.mark {
				width: 3rem;
				height: 3rem;
				margin: 0 auto 1rem;
				border-radius: 14px;
				background: linear-gradient(135deg, #6366f1, #8b5cf6);
				display: grid;
				place-items: center;
			}
			.mark svg {
				width: 1.6rem;
				height: 1.6rem;
			}
			h1 {
				margin: 0 0 0.4rem;
				font-size: 1.15rem;
				letter-spacing: -0.01em;
			}
			p {
				margin: 0 0 1.25rem;
				font-size: 0.9rem;
				line-height: 1.55;
				color: var(--text-2);
			}
			button {
				width: 100%;
				min-height: 2.9rem;
				border: none;
				border-radius: 12px;
				background: var(--accent);
				color: #fff;
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}
			button:active {
				transform: translateY(1px);
			}
			.note {
				margin: 0.9rem 0 0;
				font-size: 0.76rem;
				color: var(--text-2);
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="mark">
				<svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
					<path
						d="M9 22V10h4.2c2.8 0 4.5 1.4 4.5 3.6 0 1.5-.8 2.6-2.1 3.1L19 22h-3.2l-2.8-4.5H12.2V22H9zm3.2-7.2h1c1.1 0 1.7-.5 1.7-1.3s-.6-1.2-1.7-1.2h-1v2.5zM20.5 22l3.5-12h3.3L24 22h-3.5z"
						fill="#fff"
					/>
				</svg>
			</div>
			<h1>You're offline</h1>
			<p>
				Orderly needs a connection to reach live orders. Reconnect and we'll pick up right where
				you left off.
			</p>
			<button type="button" onclick="location.reload()">Try again</button>
			<p class="note">Tip: add Orderly to your home screen for one-tap access.</p>
		</div>
		<script>
			// Come back to life the moment the network does, without a manual reload.
			window.addEventListener('online', function () {
				location.reload();
			});
		</script>
	</body>
</html>
