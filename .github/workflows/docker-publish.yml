name: Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Navigation check
        run: npm run check:nav

  build:
    name: Build
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fs-f-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image
        run: docker save fs-f-worker:ci | gzip > /tmp/fs-f-worker.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: fs-f-worker-image
          path: /tmp/fs-f-worker.tar.gz
          retention-days: 1

  push-to-ghcr:
    name: Push to GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: fs-f-worker-image
          path: /tmp

      - name: Load image
        run: gunzip -c /tmp/fs-f-worker.tar.gz | docker load

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fs-f-worker
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Tag and push image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/fs-f-worker"
          docker tag fs-f-worker:ci "${IMAGE}:latest"
          docker tag fs-f-worker:ci "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"
